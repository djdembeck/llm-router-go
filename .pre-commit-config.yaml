# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: Go fmt
        entry: bash -e -c 'test -z "$(gofmt -l .)"'
        language: system
        pass_filenames: false
        types: [go]

      - id: go-vet
        name: Go vet
        language: system
        pass_filenames: false
        types: [go]
        entry: go vet ./...

      - id: go-mod-tidy
        name: Go mod tidy
        entry: |
          bash -c 'set -euo pipefail
          go mod tidy
          files=(go.mod)
          if [[ -f go.sum ]]; then files+=(go.sum); fi
          git diff --exit-code -- "${files[@]}"
          '
        language: system
        pass_filenames: false
        types: [go]

      - id: go-build
        name: Go build
        language: system
        pass_filenames: false
        types: [go]
        entry: go build ./...

      - id: go-test
        name: Go test
        language: system
        pass_filenames: false
        types: [go]
        entry: go test -count=1 ./...
