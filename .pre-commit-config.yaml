# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: Go fmt
        language: system
        pass_filenames: false
        types: [go]
        entry: test -z "$(gofmt -l .)"

      - id: go-vet
        name: Go vet
        language: system
        pass_filenames: false
        types: [go]
        entry: go vet ./...

      - id: go-mod-tidy
        name: Go mod tidy
        language: system
        pass_filenames: false
        types: [go]
        entry: go mod tidy && git diff --exit-code go.mod $(test -f go.sum && echo go.sum)

      - id: go-build
        name: Go build
        language: system
        pass_filenames: false
        types: [go]
        entry: go build ./...

      - id: go-test
        name: Go test
        language: system
        pass_filenames: false
        types: [go]
        entry: go test ./...
