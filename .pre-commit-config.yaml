# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: Go fmt
        entry: test -z "$(gofmt -l .)"
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: Go mod tidy
        entry: go mod tidy && git diff --exit-code go.mod $(test -f go.sum && echo go.sum)
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: Go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: Go test
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
