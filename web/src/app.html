<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>llm-router-go — fleet sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
IMPECCABLE CONTRACT — Direction Contract: "Vast Miura-Fold Sheet, dark mode"
THESIS: The fleet is a sheet. Every backend is a fold-cell in one tessellated Miura grid,
and the grid undulates with live load. The whole fleet's requests, latency, and GPU
pressure read as one field of linked creases — not a scatter of cards.
OWN-WORLD: Dark-ink matte sheet ground #0A0A0B; warm-gray mountain creases
#A6A6A0→#E8E6E0; steel-blue valley creases #8FA9C0→#CFE0EF; gold-foil live-signal
accent #C9A24B/#E4C264; signal-red #C0564B reserved for 429/5xx/saturated.
Archivo 700-italic for display, JetBrains Mono for all data. Sharp fold corners,
crease-scored 1px lit edges, subtle diagonal sheen, isometric skew on the grid
container (text stays crisp). Deploy cascade on load and on fold state change,
disabled under prefers-reduced-motion. Traces redraw on each 500ms data tick,
never a 60fps loop.
FORM: Vast Miura-Fold Sheet, dark mode.
HONEST BOUNDARY: token figures are estimated new-prefill tokens (request-body based,
~4 bytes/token) and are labeled "est" everywhere; nothing displays measured decode
throughput.
-->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
