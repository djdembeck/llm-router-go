name: CI

# Selective CI: this workflow ALWAYS runs; the `changes` job classifies the
# diff into concerns (workflow / lint / build / test / docker).
#
# The three REQUIRED-context jobs (lint-format, build, test) must never be
# job-level-skipped: a job skipped by a job-level `if` is recorded with
# check-run conclusion "skipped", and the main-branch protection gate does NOT
# credit "skipped" as passing (verified live — a PR whose required contexts
# were all "skipped" stayed BLOCKED). So those jobs always RUN and open with
# an inline Gate step that (a) fails when the `changes` job failed or any
# classifier output is malformed, (b) emits `enabled=true/false` for the
# job's concern, and (c) is required by every expensive setup/check step. A
# failed classifier therefore fails every required job (a red check-run
# blocks the merge) instead of silently passing them. With the concern
# absent, the Gate passes with `enabled=false` and the steps no-op, so the
# job's check-run conclusion is always "success" (concern off / no-op) or
# "failure" (a real check or the gate itself failed) — never "skipped". A
# required job downstream of a failed required job is skipped by its step
# conditions — harmless: that failed predecessor already blocks the merge.
#
# Non-required jobs (workflow-lint, docker-build) may still be
# job-level-skipped freely — their contexts are not required on main.
#
# Never add event-level paths/paths-ignore here: filtering the whole workflow
# leaves the required check contexts pending forever.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: read-all

env:
  PR_IS_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.classify.outputs.workflow }}
      lint: ${{ steps.classify.outputs.lint }}
      build: ${{ steps.classify.outputs.build }}
      test: ${{ steps.classify.outputs.test }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          WORKFLOW=false
          LINT=false
          BUILD=false
          TEST=false
          DOCKER=false

          ALL_TRUE() {
            WORKFLOW=true
            LINT=true
            BUILD=true
            TEST=true
            DOCKER=true
          }

          case "$EVENT_NAME" in
            pull_request)
              # PRs diff against the merge base, not the base-head SHA: the
              # base branch may have advanced since the PR was created. Both
              # SHAs exist (fetch-depth: 0); an unresolvable merge-base falls
              # back to the full run via the git-diff failure path below.
              BASE="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null)" || BASE="$PR_BASE_SHA"
              HEAD="$PR_HEAD_SHA"
              ;;
            push)
              case "$EVENT_REF" in
                refs/tags/*)
                  # Tag pushes have no diff base — full run.
                  BASE=""
                  ;;
                *)
                  # Pushes diff before..sha; github.event.before is unresolvable
                  # for the first push of a new branch — no diff base, classify
                  # conservatively.
                  BASE="$EVENT_BEFORE"
                  if [ -n "$BASE" ] && ! git rev-parse --verify -q "${BASE}^{commit}" >/dev/null; then
                    echo "Unresolvable base ${BASE} — classifying all concerns as changed"
                    BASE=""
                  fi
                  ;;
              esac
              HEAD="$HEAD_SHA"
              ;;
            *)
              # workflow_dispatch: no diff, full run.
              BASE=""
              ;;
          esac

          DIFF_FILE="$(mktemp)"
          if [ -n "$BASE" ] && git diff --name-only -z --no-renames "$BASE" "$HEAD" > "$DIFF_FILE" 2>/dev/null; then
            if [ ! -s "$DIFF_FILE" ]; then
              echo "Empty diff — classifying all concerns as changed"
              ALL_TRUE
            else
              while IFS= read -r -d '' path; do
                case "$path" in
                  .github/workflows/*.yml|.github/workflows/*.yaml|.ci-verify/*) WORKFLOW=true ;;
                  web/embed.go|web/embed_stub.go) LINT=true; BUILD=true; TEST=true; DOCKER=true ;;
                  *_test.go) LINT=true; TEST=true ;;
                  web/src/*|web/package.json|web/bun.lock|web/vite.config.ts|web/svelte.config.js|web/tsconfig.json) BUILD=true; DOCKER=true ;;
                  *.go) LINT=true; BUILD=true; TEST=true; DOCKER=true ;;
                  go.mod|go.sum) LINT=true; BUILD=true; TEST=true; DOCKER=true ;;
                  Dockerfile|.dockerignore) DOCKER=true ;;
                  # *.md covers all markdown anywhere (CHANGELOG.md,
                  # PRODUCT.md, DESIGN.md, .github/**/*.md, docs/*.md);
                  # docs/* adds non-markdown doc assets.
                  *.md|docs/*|renovate.json5|.pre-commit-config.yaml|.gitignore|.editorconfig|LICENSE|.env.example|.impeccable/*) : ;;
                  *) LINT=true; BUILD=true; TEST=true; DOCKER=true ;;
                esac
              done < "$DIFF_FILE"
            fi
          else
            echo "No usable diff (tag/dispatch, unresolvable base, or git error) — classifying all concerns as changed"
            ALL_TRUE
          fi
          rm -f "$DIFF_FILE"

          {
            echo "workflow=${WORKFLOW}"
            echo "lint=${LINT}"
            echo "build=${BUILD}"
            echo "test=${TEST}"
            echo "docker=${DOCKER}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Changes"
            echo ""
            echo "| Concern | Triggered |"
            echo "|---|---|"
            echo "| workflow | ${{ steps.classify.outputs.workflow }} |"
            echo "| lint | ${{ steps.classify.outputs.lint }} |"
            echo "| build | ${{ steps.classify.outputs.build }} |"
            echo "| test | ${{ steps.classify.outputs.test }} |"
            echo "| docker | ${{ steps.classify.outputs.docker }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: Workflow Lint
    needs: [changes]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Lint workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: CI Verify harness
        # Focused harness for the classifier script and the gate expressions
        # (Python preinstalled on ubuntu-latest; PyYAML only).
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .ci-verify/classify_test.py
          python3 .ci-verify/gate_test.py

  lint-format:
    name: Lint & Format
    needs: [changes]
    if: ${{ !cancelled() }}
    # Required context: never job-level-skipped. Runs always; the Gate step
    # fails when classification failed, emits `enabled`, and no-ops the
    # expensive steps (conclusion success) when the lint concern is absent.
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        if: ${{ !cancelled() }}
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ needs['changes'].result }}" != "success" ]; then
            echo "::error::Changes job finished with '${{ needs['changes'].result }}'; failing gate"
            exit 1
          fi
          for v in '${{ needs['changes'].outputs.workflow }}' '${{ needs['changes'].outputs.lint }}' '${{ needs['changes'].outputs.build }}' '${{ needs['changes'].outputs.test }}' '${{ needs['changes'].outputs.docker }}'; do
            if [ "$v" != "true" ] && [ "$v" != "false" ]; then
              echo "::error::Malformed classifier output: '$v' (expected true/false); failing gate"
              exit 1
            fi
          done
          if [ "${{ needs['changes'].outputs.lint }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipped - no lint-relevant changes"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        run: test -z "$(gofmt -l .)"

      - name: Vet
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        run: go vet ./...

      - name: Mod tidy
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          go mod tidy
          if [ -f go.sum ]; then
            git diff --exit-code go.mod go.sum
          else
            git diff --exit-code go.mod
          fi

  build:
    name: Build
    needs: [changes, workflow-lint, lint-format]
    if: ${{ !cancelled() }}
    # Required context: never job-level-skipped. The inline Gate circuit-
    # breaks on a failed upstream required job and on a failed/malformed
    # classification, emits `enabled`, and no-ops the expensive steps (job
    # conclusion success) when the build concern is absent.
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        if: ${{ !cancelled() }}
        id: gate
        run: |
          set -euo pipefail
          for r in "${{ needs['changes'].result }}" "${{ needs['lint-format'].result }}" "${{ needs['workflow-lint'].result }}"; do
            if [ "$r" = "failure" ]; then
              echo "::error::Upstream job failed; failing gate"
              exit 1
            fi
          done
          if [ "${{ needs['changes'].result }}" != "success" ]; then
            echo "::error::Changes job finished with '${{ needs['changes'].result }}'; failing gate"
            exit 1
          fi
          for v in '${{ needs['changes'].outputs.workflow }}' '${{ needs['changes'].outputs.lint }}' '${{ needs['changes'].outputs.build }}' '${{ needs['changes'].outputs.test }}' '${{ needs['changes'].outputs.docker }}'; do
            if [ "$v" != "true" ] && [ "$v" != "false" ]; then
              echo "::error::Malformed classifier output: '$v' (expected true/false); failing gate"
              exit 1
            fi
          done
          if [ "${{ needs['changes'].outputs.build }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipped - no build-relevant changes"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && needs['lint-format'].result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && needs['lint-format'].result == 'success' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && needs['lint-format'].result == 'success' }}
        run: go build ./...

  test:
    name: Test
    needs: [changes, workflow-lint, lint-format, build]
    if: ${{ !cancelled() }}
    # Required context: never job-level-skipped. The inline Gate circuit-
    # breaks on a failed upstream required job and on a failed/malformed
    # classification, emits `enabled`, and no-ops the expensive steps (job
    # conclusion success) when the test concern is absent.
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        if: ${{ !cancelled() }}
        id: gate
        run: |
          set -euo pipefail
          for r in "${{ needs['changes'].result }}" "${{ needs['lint-format'].result }}" "${{ needs['workflow-lint'].result }}" "${{ needs['build'].result }}"; do
            if [ "$r" = "failure" ]; then
              echo "::error::Upstream job failed; failing gate"
              exit 1
            fi
          done
          if [ "${{ needs['changes'].result }}" != "success" ]; then
            echo "::error::Changes job finished with '${{ needs['changes'].result }}'; failing gate"
            exit 1
          fi
          for v in '${{ needs['changes'].outputs.workflow }}' '${{ needs['changes'].outputs.lint }}' '${{ needs['changes'].outputs.build }}' '${{ needs['changes'].outputs.test }}' '${{ needs['changes'].outputs.docker }}'; do
            if [ "$v" != "true" ] && [ "$v" != "false" ]; then
              echo "::error::Malformed classifier output: '$v' (expected true/false); failing gate"
              exit 1
            fi
          done
          if [ "${{ needs['changes'].outputs.test }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipped - no test-relevant changes"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && needs['lint-format'].result == 'success' && needs['build'].result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && needs['lint-format'].result == 'success' && needs['build'].result == 'success' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && needs['lint-format'].result == 'success' && needs['build'].result == 'success' }}
        run: go test ./...

  docker-build:
    name: Build and Push Docker Image
    needs: [changes, workflow-lint, lint-format, build, test]
    # workflow-lint is non-required and job-level-skipped when no workflow file
    # changed, so accept success|skipped for it. The three required jobs always
    # RUN (concern-off = no-op success), so a required job being "skipped" here
    # means its gate tripped on a failed upstream -> docker must stay skipped;
    # require plain success for those.
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.docker == 'true' && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped') && needs['lint-format'].result == 'success' && needs['build'].result == 'success' && needs['test'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/djdembeck/llm-router-go
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find existing PR comment
        if: ${{ github.event_name == 'pull_request' && env.PR_IS_SAME_REPO == 'true' }}
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Docker Image Ready'

      - name: Comment PR with image tags
        if: ${{ github.event_name == 'pull_request' && env.PR_IS_SAME_REPO == 'true' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Docker Image Ready

            The following image tag is available for testing this PR:

            | Tag | Image |
            |-----|-------|
            | `pr-${{ github.event.pull_request.number }}` | `ghcr.io/djdembeck/llm-router-go:pr-${{ github.event.pull_request.number }}` |

            **Note:** This tag is stable for this PR. Each new commit will overwrite this tag with the latest build.

            **To test:**
            ```bash
            docker pull ghcr.io/djdembeck/llm-router-go:pr-${{ github.event.pull_request.number }}
            ```

            Images will be automatically deleted when the PR is merged or closed.
          edit-mode: replace
