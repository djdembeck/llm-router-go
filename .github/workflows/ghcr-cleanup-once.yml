# One-off: delete accidental release artifacts (v1.0.2, v1.0.3) from the
# Oct 26 2026 mis-merge to main. USAGE: trigger once, then delete this
# workflow file in a follow-up commit (do not merge it elsewhere).
name: GHCR cleanup (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Remove tags and manifests via the registry
        env:
          GHCR_USER: djdembeck
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS: v1.0.2 v1.0.3
        run: |
          set -uo pipefail
          RT=$(curl -fsS -u "$GHCR_USER:$GHCR_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$GHCR_USER/llm-router-go:pull,delete" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          for tag in $TARGETS; do
            HD=$(curl -fsS -D - -o /dev/null \
              -H "Authorization: Bearer $RT" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json, \
                 application/vnd.oci.image.manifest.v1+json, \
                 application/vnd.docker.distribution.manifest.list.v2+json, \
                 application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/$GHCR_USER/llm-router-go/manifests/$tag")
            DIG=$(printf '%s' "$HD" | tr -d '\r' | sed -ne 's/^docker-content-digest: //Ip')
            MT=$(printf '%s' "$HD" | tr -d '\r' | sed -ne 's/^content-type: //Ip')
            [ -z "$DIG" ] && { echo "tag $tag: no digest, skipping"; continue; }
            echo "tag $tag -> $DIG ($MT)"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $RT" \
              "https://ghcr.io/v2/$GHCR_USER/llm-router-go/manifests/$DIG")
            echo "DELETE $tag ($DIG) -> HTTP $CODE"
          done

      - name: Verify
        env:
          GHCR_USER: djdembeck
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS: v1.0.2 v1.0.3
        run: |
          set -uo pipefail
          RT=$(curl -fsS -u "$GHCR_USER:$GHCR_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$GHCR_USER/llm-router-go:pull,delete" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          rc=0
          for tag in $TARGETS; do
            if curl -fsS -H "Authorization: Bearer $RT" \
                 "https://ghcr.io/v2/$GHCR_USER/llm-router-go/manifests/$tag" \
                 -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
                 -o /dev/null 2>/dev/null; then
              echo "ERROR: $tag still resolvable in the registry"
              rc=1
            else
              echo "$tag is gone"
            fi
          done
          exit $rc
