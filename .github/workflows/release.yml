# One ordinary develop -> main promotion; no version commits or merge-back.
# Annalist's existing GitHub App fills notes after complete publication.
name: Release

on:
  push:
    branches: [main]
    # Ops-only commits must never cut a release: docs, CI workflows, and
    # Renovate config. (Committing renovate.json5 to main triggered v1.0.3
    # in Oct 2026 for a no-code change.)
    paths-ignore: ['*.md', 'docs/**', '.github/**', 'renovate.json5']
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit vX.Y.Z; empty allocates from reachable reservations'
        required: false
        default: ''
      bump:
        description: 'auto, patch, minor, or major'
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the configured release branch before publishing
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" == refs/heads/main ]] || { echo 'Release must run on main'; exit 1; }

  reserve:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reserve one immutable source/version identity
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_INPUT: ${{ inputs.bump }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--sha "$SOURCE" --bump "${BUMP_INPUT:-auto}")
          if [[ -n "$VERSION_INPUT" ]]; then args+=(--version "$VERSION_INPUT"); fi
          if [[ "$RELEASE_EVENT" == push ]]; then args+=(--automatic); fi
          tag=$(python3 scripts/release.py reserve "${args[@]}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  outputs:
    needs: reserve
    if: needs.reserve.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.reserve.outputs.tag }}
      SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify the actual versioned Go build
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
          go build -ldflags="-X main.version=$VERSION -X main.gitCommit=$SOURCE" -o "$RUNNER_TEMP/router" .
          output=$("$RUNNER_TEMP/router" -h 2>&1)
          [[ "$output" == *"$VERSION (commit $SOURCE)"* ]]
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile the source-bound immutable version image
        run: python3 scripts/release.py image --source "$SOURCE" --version "$VERSION"

  publish:
    needs: [reserve, outputs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish only after all native outputs complete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.reserve.outputs.tag }}
          SOURCE: ${{ github.sha }}
        run: |
          python3 scripts/release.py release --tag "$TAG" --source "$SOURCE"
          python3 scripts/release.py release --tag "$TAG" --source "$SOURCE" --publish
