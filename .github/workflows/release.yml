# Release workflow (fill_after mode): GitHub App fills release body via webhook.
# Gitflow: releases are cut on each develop -> main merge; develop pushes do NOT release.

name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.github/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (vX.Y.Z). Empty = auto-bump from commits."
        required: false
        default: ""
      bump:
        description: "Bump level when version is empty: auto|patch|minor|major"
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          BUMP_INPUT="${{ inputs.bump }}"

          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | head -n 1 || true)

          if [ -n "$VERSION_INPUT" ]; then
            NEW_VERSION="${VERSION_INPUT#v}"
            if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version input: ${VERSION_INPUT} (expected vX.Y.Z)"
              exit 1
            fi
            NEW_VERSION="v${NEW_VERSION}"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            MAJOR="${LATEST_TAG#v}"; MAJOR="${MAJOR%%.*}"
            REST="${LATEST_TAG#v*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

            case "$BUMP_INPUT" in
              auto|"")
                if [ -z "$(git log --format=%H "${LATEST_TAG}..HEAD" 2>/dev/null)" ]; then
                  PREV_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | sed -n 2p || true)
                  echo "new_version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
                  echo "No commits since ${LATEST_TAG} — reusing it"
                  exit 0
                fi
                LOG=$(git log --format=%B "${LATEST_TAG}..HEAD" 2>/dev/null || true)
                if echo "$LOG" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!: '; then LEVEL=major
                elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?: '; then LEVEL=minor
                else LEVEL=patch; fi
                ;;
              patch|minor|major) LEVEL="$BUMP_INPUT" ;;
              *) echo "Invalid bump input: ${BUMP_INPUT} (auto|patch|minor|major)"; exit 1 ;;
            esac

            case "$LEVEL" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LATEST_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION} (previous: ${LATEST_TAG:-none})"

      - name: Create and push tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.tag.outputs.created == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release Docker image
        if: steps.tag.outputs.created == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          IMAGE="ghcr.io/djdembeck/llm-router-go:${VERSION}"

          # Skip if image already exists
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Docker image ${IMAGE} already exists, skipping"
            exit 0
          fi

          # Build and push
          # Note: The Dockerfile does NOT define ARG VERSION. To add version stamping:
          #   add ARG VERSION=devel and -ldflags "-w -s -X github.com/djdembeck/llm-router-go.Version=${VERSION}"
          #   to the Dockerfile build step. Default 'devel' keeps develop/PR images honest.
          docker build -t "${IMAGE}" --build-arg VERSION="${VERSION}" .
          docker push "${IMAGE}"
          echo "Pushed ${IMAGE}"

      - name: Sync release back to develop
        if: steps.tag.outputs.created == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"

          # Fetch develop
          git fetch origin develop:develop

          # Check if main is already contained in develop
          if git merge-base --is-ancestor origin/main develop; then
            echo "main is already contained in develop, skipping sync"
            exit 0
          fi

          # Merge main into develop
          git checkout develop
          git merge --no-ff main -m "chore(release): sync ${VERSION} back to develop [skip ci]"
          git push origin develop
          echo "Synced ${VERSION} back to develop"
          # If develop is branch-protected, replace this with a peter-evans/create-pull-request sync PR

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"

          # Already released?
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — nothing to do"
            exit 0
          fi

          # Create the release (GitHub App fills release body via webhook)
          gh release create "${VERSION}" --title "Release ${VERSION}"
          echo "Release ${VERSION} created"
