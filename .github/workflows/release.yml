name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.sha }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

  ai-changelog:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Resolve tag and previous tag
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_TAG="${{ inputs.tag_name }}"
          else
            CURRENT_TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1 || true)
          echo "current=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous tag: ${PREV_TAG:-<none, first release>}"

      - uses: nosovj/llm-release-action@aba906f1ff5d376390d9e751bf407f40971079e0 # v1
        id: llm
        with:
          model: openai/${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          current_version: ${{ steps.tags.outputs.prev }}
          head_ref: ${{ steps.tags.outputs.current }}
          max_commits: '100'
          temperature: '0.3'
          max_tokens: '4096'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Update GitHub Release with AI changelog
        run: |
          CHANGELOG=$(jq -r '.default.en' <<< "$LLM_CHANGLOGS")
          if [ -z "$CHANGELOG" ] || [ "$CHANGELOG" = "null" ]; then
            echo "No changelog generated, keeping default release notes"
            exit 0
          fi
          gh release edit "${{ steps.tags.outputs.current }}" --notes "$CHANGELOG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_CHANGLOGS: ${{ steps.llm.outputs.changelogs }}
