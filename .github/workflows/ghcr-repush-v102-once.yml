# One-off: rebuild and push v1.0.2 (+latest) from the v1.0.2 tag commit
# (b8d2154). The v1.0.2 image in GHCR predates the miura merge because
# release.yml skipped the build over the stale pre-existing image.
# Delete this file after the run.
name: GHCR repush v1.0.2 (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  repush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.2
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker build --load \
            -t ghcr.io/djdembeck/llm-router-go:v1.0.2 \
            -t ghcr.io/djdembeck/llm-router-go:latest \
            --build-arg VERSION=v1.0.2 -f Dockerfile .
          docker push ghcr.io/djdembeck/llm-router-go:v1.0.2
          docker push ghcr.io/djdembeck/llm-router-go:latest
          echo "pushed"

      - name: Verify manifests
        run: |
          set -euo pipefail
          GHCR_USER=djdembeck
          TOK=$(gh auth token)
          RT=$(curl -fsS -u "$GHCR_USER:$TOK" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:djdembeck/llm-router-go:pull" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          for tag in v1.0.2 latest; do
            d=$(curl -fsS -D - -o /dev/null \
              -H "Authorization: Bearer $RT" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/djdembeck/llm-router-go/manifests/$tag" \
              | tr -d '\r' | sed -ne 's/^docker-content-digest: //Ip')
            echo "$tag -> $d"
          done
